[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "envassure"
dynamic = ["version"]
description = "Environment Assurance Compiler — turn operational evidence into typed IR, executable runtimes, and assurance artifacts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "EnvAssure contributors" },
]
keywords = [
  "environment",
  "assurance",
  "compiler",
  "agent-evaluation",
  "simulation",
]
classifiers = [
  # Stay on Pre-Alpha for 0.2.0.dev* builds. Switch to
  # "Development Status :: 4 - Beta" only on the v0.2.0b1 tag commit
  # (see docs/contributing/release-process.md).
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "tomli>=2.0.1; python_version < '3.11'",
  "tomli-w>=1.0.0,<2",
  "pyyaml>=6.0.1,<7",
  "packaging>=24.0",
]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
pettingzoo = ["pettingzoo>=1.24", "gymnasium>=0.29"]
model-assisted = ["httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.1,<4"]
# System OPA binary required for evaluate/test; not vendored into the wheel.
opa = []
# Exact pin after Milestone C spike (huggingface/OpenEnv → openenv 0.4.1).
openenv = ["openenv==0.4.1", "gymnasium>=0.29"]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mike>=2.1",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "syrupy>=4.6",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-toml>=0.10",
]

[project.scripts]
eac = "envassure.cli.main:app"

[project.entry-points."envassure.proposal_providers"]
stub = "envassure.model_assisted:StubProposalProvider"
http = "envassure.model_assisted.http:HttpProposalProvider"

[project.urls]
Homepage = "https://github.com/fraware/environment-assurance-compiler"
Documentation = "https://github.com/fraware/environment-assurance-compiler#readme"
Repository = "https://github.com/fraware/environment-assurance-compiler"
Issues = "https://github.com/fraware/environment-assurance-compiler/issues"

[tool.hatch.version]
path = "src/envassure/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/adrs",
  "/schemas",
  "/examples",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/mkdocs.yml",
  "/scripts",
  "/Dockerfile",
  "/Dockerfile.openenv",
  "/docker",
]

# Ship published JSON schemas inside the wheel for offline consumers / acceptance.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "envassure/schemas"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
  "B008",  # Typer Argument/Option defaults are intentional
  "RUF012",  # ClassVar annotations for Protocol-like metadata
]

[tool.ruff.lint.isort]
known-first-party = ["envassure"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = false
show_error_codes = true
mypy_path = "src"
files = ["src/envassure"]

[[tool.mypy.overrides]]
module = [
  "tomli_w",
  "yaml",
  "gymnasium",
  "gymnasium.*",
  "pettingzoo",
  "pettingzoo.*",
  "psycopg",
  "psycopg.*",
  "httpx",
  "httpx.*",
  "openenv",
  "openenv.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "envassure.runtime.effects",
  "envassure.sources.procedure",
  "envassure.sources.openapi",
  "envassure.plugins",
  "envassure.differential.compare",
  "envassure.differential.probes",
  "envassure.cli.commands.diffval_cmds",
  "envassure.runtime.adapters.gymnasium_env",
  "envassure.runtime.adapters.pettingzoo_env",
  "envassure.runtime.adapters.openenv_service",
  "envassure.tasks",
  "envassure.verifiers",
  "envassure.analysis.mutation",
]
disable_error_code = ["no-any-return", "arg-type", "var-annotated", "unused-ignore"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = [
  "gym: requires envassure[gym] (gymnasium)",
  "pettingzoo: requires envassure[pettingzoo]",
  "openenv: requires envassure[openenv]",
  "opa: requires system OPA binary and/or envassure[opa]",
  "compose: requires Docker Compose (set ENVASURE_RUN_COMPOSE=1)",
]

[tool.coverage.run]
branch = true
source = ["envassure"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Overall floor (~78% measured 2026-07-25). Path-scoped gates:
# .coveragerc.cores (80), .coveragerc.assurance (80),
# .coveragerc.semantic (90) — see docs/research/release-readiness-0.2.md
# and docs/security/supply-chain.md.
fail_under = 75
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
