name: Reproduce evidence

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or ref to reproduce (default: triggering SHA)"
        required: false
        type: string
      python:
        description: "Python version"
        required: false
        default: "3.12"
        type: string
  pull_request:
    paths:
      - "scripts/reproduce_evidence.py"
      - "scripts/cross_python_reproducibility.py"
      - "tests/test_reproduce_evidence.py"
      - "tests/test_cross_python_reproducibility.py"
      - ".github/workflows/reproduce.yml"

permissions:
  contents: read

jobs:
  reproduce:
    name: reproduce deterministic pack evidence
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ github.event.inputs.python || '3.12' }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reproduce twice and compare
        run: |
          set -euo pipefail
          mkdir -p reproduce/run-a reproduce/run-b
          python scripts/reproduce_evidence.py --output-dir reproduce/run-a
          python scripts/reproduce_evidence.py --output-dir reproduce/run-b
          diff -u reproduce/run-a/evidence.json reproduce/run-b/evidence.json
          diff -u reproduce/run-a/manifest.json reproduce/run-b/manifest.json
          sha256sum reproduce/run-a/counter.eap reproduce/run-b/counter.eap
          cmp reproduce/run-a/counter.eap reproduce/run-b/counter.eap

      - name: Verify reproduced pack independently
        run: eac verify-pack reproduce/run-a/counter.eap --json

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproduced-evidence
          path: reproduce/
          if-no-files-found: error

  cross-python:
    name: compare Python 3.11 / 3.12 pack evidence
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Build canonical evidence
        run: python scripts/cross_python_reproducibility.py build --output-dir cross-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-python-${{ matrix.python }}
          path: cross-python/
          if-no-files-found: error

  compare-cross-python:
    name: require cross-Python identity
    needs: cross-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cross-python-3.11
          path: evidence-3.11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cross-python-3.12
          path: evidence-3.12
      - name: Compare evidence
        run: |
          python scripts/cross_python_reproducibility.py compare \
            evidence-3.11/evidence.json \
            evidence-3.12/evidence.json
