name: Reproduce

# Build / refresh the reproducibility bundle, then verify it in a second job
# that does not check out the source tree.

on:
  push:
    branches: [main]
    paths:
      - "packs/**"
      - "reproducibility/**"
      - "schemas/benchmark-pack-1.json"
      - "src/envassure/benchmark/pack_format.py"
      - "src/envassure/cli/commands/benchmark_pack_cmds.py"
      - "scripts/generate_benchmark_packs.py"
      - "scripts/generate_reproducibility_bundle.py"
      - ".github/workflows/reproduce.yml"
  pull_request:
    branches: [main]
    paths:
      - "packs/**"
      - "reproducibility/**"
      - "schemas/benchmark-pack-1.json"
      - "src/envassure/benchmark/pack_format.py"
      - "src/envassure/cli/commands/benchmark_pack_cmds.py"
      - "scripts/generate_benchmark_packs.py"
      - "scripts/generate_reproducibility_bundle.py"
      - ".github/workflows/reproduce.yml"
  workflow_dispatch:

concurrency:
  group: reproduce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    name: build + pack verify + bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint and verify benchmark packs
        run: |
          eac pack lint packs --json
          eac pack verify packs --json
      - name: Refresh reproducibility bundle
        run: python scripts/generate_reproducibility_bundle.py --refresh
      - name: In-tree verify
        run: bash reproducibility/verify.sh
      - name: Stage artifact
        run: |
          mkdir -p dist-repro
          cp -a reproducibility/. dist-repro/
          # Drop VCS / editor noise if any
          rm -rf dist-repro/.git || true
          tar -C dist-repro -czf reproducibility-bundle.tar.gz .
      - name: Upload reproducibility bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reproducibility-bundle
          path: |
            dist-repro/
            reproducibility-bundle.tar.gz
          if-no-files-found: error

  verify-without-checkout:
    name: verify without source checkout
    needs: build-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reproducibility-bundle
          path: bundle-dl
      - name: Extract and verify (no checkout)
        run: |
          set -euo pipefail
          # Prefer the tarball: actions/upload-artifact drops empty files from
          # directory uploads, which omits results/.gitkeep from dist-repro/.
          if [[ -f bundle-dl/reproducibility-bundle.tar.gz ]]; then
            mkdir -p extracted
            tar -xzf bundle-dl/reproducibility-bundle.tar.gz -C extracted
            cd extracted
          elif [[ -d bundle-dl/dist-repro ]]; then
            cd bundle-dl/dist-repro
          else
            # Artifact may unpack files at the top level
            cd bundle-dl
          fi
          test -f MANIFEST.json
          test -f verify.sh
          bash verify.sh
          echo "verify-without-checkout OK"
