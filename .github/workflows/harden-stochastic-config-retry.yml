name: Retry stochastic configuration hardening

on:
  push:
    branches: [assurance/p0-stochastic-equivalence]
    paths:
      - ".github/workflows/harden-stochastic-config-retry.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/p0-stochastic-equivalence

      - name: Fail closed on invalid stochastic configuration
        run: echo '' | base64 -d | python

      - name: Commit stochastic configuration hardening
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/differential/compare.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(differential): fail closed on invalid stochastic config"
          git push origin HEAD:assurance/p0-stochastic-equivalence
