name: One-shot protocol typing fix

on:
  push:
    branches: [assurance/eac-r15-protocol]
    paths:
      - ".github/workflows/fix-eac-r15-mypy-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/eac-r15-protocol
      - name: Apply asserted typing fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/envassure/benchmark/qualification.py")
          text = path.read_text(encoding="utf-8")
          old = '''    for family, expected in registered.items():\n        item = observed.get(family)\n        if item is None:\n            all_complete = False\n            continue\n        if item.source_package_digest != expected.source_package_digest:\n            blockers.append(f"source_package_digest_mismatch:{family}")\n        if item.heldout_probe_commitment != expected.heldout_probe_commitment:\n            blockers.append(f"probe_commitment_mismatch:{family}")\n        if item.adjudicated_probe_count < expected.heldout_probe_count:\n            blockers.append(f"insufficient_adjudicated_probes:{family}")\n        if item.status != "complete":\n            all_complete = False\n            blockers.append(f"workflow_not_complete:{family}:{item.status}")\n'''
          new = '''    for family, expected in registered.items():\n        evidence_item = observed.get(family)\n        if evidence_item is None:\n            all_complete = False\n            continue\n        if evidence_item.source_package_digest != expected.source_package_digest:\n            blockers.append(f"source_package_digest_mismatch:{family}")\n        if evidence_item.heldout_probe_commitment != expected.heldout_probe_commitment:\n            blockers.append(f"probe_commitment_mismatch:{family}")\n        if evidence_item.adjudicated_probe_count < expected.heldout_probe_count:\n            blockers.append(f"insufficient_adjudicated_probes:{family}")\n        if evidence_item.status != "complete":\n            all_complete = False\n            blockers.append(f"workflow_not_complete:{family}:{evidence_item.status}")\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one evidence loop")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit typing fix
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/benchmark/qualification.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(benchmark): narrow optional workflow evidence"
          git push origin HEAD:assurance/eac-r15-protocol
