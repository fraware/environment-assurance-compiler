name: One-shot EAC-R15 main synchronization

on:
  push:
    branches: [assurance/eac-r15-protocol]
    paths:
      - ".github/workflows/sync-eac-r15-main-once.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/eac-r15-protocol
          fetch-depth: 0
      - name: Merge current main without rewriting protocol history
        run: |
          set -euo pipefail
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:assurance/eac-r15-protocol
