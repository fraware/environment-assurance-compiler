name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: ruff / mypy / pytest (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  smoke:
    name: eac smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: eac --help
        run: eac --help
        env:
          PYTHONIOENCODING: utf-8
      - name: eac init
        shell: bash
        run: |
          eac init smoke-ws --name smoke
          test -f smoke-ws/eac.toml
          eac doctor --path smoke-ws
      - name: fail-closed on missing args / unsupported migrate
        shell: bash
        run: |
          set +e
          eac diff
          code=$?
          set -e
          # Typer usage error (missing required args) must not look like success.
          test "$code" -ne 0
          # Unsupported IR version must fail closed via migrate diagnostics.
          python - <<'PY'
          from pathlib import Path
          Path("bad-ir.json").write_text(
              '{"ir_version":"9.9.9","environment_id":"x","name":"x"}',
              encoding="utf-8",
          )
          PY
          set +e
          eac migrate bad-ir.json --json
          code=$?
          set -e
          test "$code" -ne 0
