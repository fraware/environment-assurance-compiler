# Security gates extracted from ci.yml: secrets, dependency audit, CodeQL,
# and container image scan (when Dockerfile context is available).

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.28.0"
  GITLEAKS_LINUX_X64_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install verified gitleaks
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --location \
            --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 300 \
            --connect-timeout 15 --max-time 180 \
            -o "$ARCHIVE" "$URL"
          test -s "$ARCHIVE"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks version
          ./gitleaks version | grep -Fq "$GITLEAKS_VERSION"
      - name: Scan repository history
        run: ./gitleaks detect --source . --verbose --redact --no-banner

  dependency-audit:
    name: pip-audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit clean runtime install
        run: |
          python -m pip install --upgrade pip
          python -m venv /tmp/eac-audit
          /tmp/eac-audit/bin/pip install --upgrade pip pip-audit
          /tmp/eac-audit/bin/pip install .
          /tmp/eac-audit/bin/pip-audit --progress-spinner=off

  codeql:
    name: CodeQL (Python)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3 (3.37.8)
        with:
          languages: python
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@42947a340483f03ba47bb1a039b2c519aab3df85 # v3 (3.37.8)
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3 (3.37.8)
        with:
          category: "/language:python"

  image-scan:
    name: Dockerfile Trivy config + fs scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem / config (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
        continue-on-error: false
