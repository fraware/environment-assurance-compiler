name: One-shot reproducible pack serializer patch

on:
  push:
    branches: [assurance/reproducibility-py311-py312]
    paths:
      - ".github/workflows/patch-reproducible-pack-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/reproducibility-py311-py312
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded serializer patch
        run: echo '' | base64 -d | python
      - name: Validate focused reproducibility tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check src/envassure/packaging/__init__.py tests/test_reproducible_pack.py
          ruff format --check src/envassure/packaging/__init__.py tests/test_reproducible_pack.py
          pytest -q tests/test_reproducible_pack.py tests/test_pack_adversarial.py
      - name: Commit serializer patch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/packaging/__init__.py
          git diff --cached --quiet && exit 1
          git commit -m "feat(pack): support reproducible SOURCE_DATE_EPOCH archives"
          git push origin HEAD:assurance/reproducibility-py311-py312
