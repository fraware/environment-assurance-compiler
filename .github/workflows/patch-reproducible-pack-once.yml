name: One-shot reproducibility quality cleanup

on:
  push:
    branches: [assurance/reproducibility-py311-py312]
    paths:
      - ".github/workflows/patch-reproducible-pack-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/reproducibility-py311-py312
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean and format reproducibility implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/cross_python_reproducibility.py")
          text = path.read_text(encoding="utf-8")
          old = "from envassure.canonical import canonical_hash, sha256_hex\n"
          new = "from envassure.canonical import canonical_hash\n"
          if text.count(old) != 1:
              raise SystemExit(f"unexpected canonical import anchor: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff format src/envassure/packaging/__init__.py scripts/cross_python_reproducibility.py tests/test_reproducible_pack.py
          ruff check src/envassure/packaging/__init__.py scripts/cross_python_reproducibility.py tests/test_reproducible_pack.py
          pytest -q tests/test_reproducible_pack.py tests/test_pack_adversarial.py
          python scripts/cross_python_reproducibility.py build --output-dir /tmp/repro-evidence
          eac pack verify /tmp/repro-evidence/counter-reproducibility.eap --json
      - name: Commit quality cleanup
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/packaging/__init__.py scripts/cross_python_reproducibility.py tests/test_reproducible_pack.py
          git diff --cached --quiet && exit 1
          git commit -m "test(reproducibility): validate canonical evidence build"
          git push origin HEAD:assurance/reproducibility-py311-py312
