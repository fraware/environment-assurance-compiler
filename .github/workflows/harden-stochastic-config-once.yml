name: One-shot stochastic configuration hardening

on:
  push:
    branches: [assurance/p0-stochastic-equivalence]
    paths:
      - ".github/workflows/harden-stochastic-config-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/p0-stochastic-equivalence

      - name: Fail closed on invalid stochastic configuration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/envassure/differential/compare.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if tol.equivalence_margin <= 0:
        return DimensionVerdict(
            dimension=ComparisonDimension.SUCCESS,
            status=VerdictStatus.INDETERMINATE,
            statistical=True,
            confidence_note="equivalence_margin must be positive for stochastic comparison",
            detail="invalid_equivalence_margin",
        )
    if tol.stochastic_z <= 0:
'''
          new = '''    if not 0.0 < tol.equivalence_margin < 1.0:
        return DimensionVerdict(
            dimension=ComparisonDimension.SUCCESS,
            status=VerdictStatus.INDETERMINATE,
            statistical=True,
            confidence_note=(
                "equivalence_margin must lie strictly inside (0, 1) for binary rate difference"
            ),
            detail="invalid_equivalence_margin",
        )
    if tol.stochastic_min_samples <= 0:
        return DimensionVerdict(
            dimension=ComparisonDimension.SUCCESS,
            status=VerdictStatus.INDETERMINATE,
            statistical=True,
            confidence_note="stochastic_min_samples must be positive",
            detail="invalid_minimum_samples",
        )
    if not tol.stochastic_z > 0:
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected stochastic configuration validation block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit stochastic configuration hardening
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/differential/compare.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(differential): fail closed on invalid stochastic config"
          git push origin HEAD:assurance/p0-stochastic-equivalence
