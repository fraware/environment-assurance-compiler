name: Nightly empirical (local schedule)

# Full concealed benchmark without the CI --max-probes 20 cap.
# Schedule-only: no secrets required. Does not publish releases.
# CI keeps a capped --max-probes 20 run for PR latency.

on:
  schedule:
    # Mondays 06:15 UTC — adjust if the repo enables Actions schedules.
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: nightly-empirical-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  concealed-full:
    name: concealed suite (full probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Full concealed suite (offline)
        run: |
          # Fixtures claim ≥100 curated + ≥100 generated probes per workflow.
          # Do not pass --max-probes so generators run to their declared sizes.
          eac benchmark --concealed --json | tee concealed-full.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: concealed-full-json
          path: concealed-full.json
          if-no-files-found: warn
