name: One-shot stochastic import ordering

on:
  push:
    branches: [assurance/p0-stochastic-equivalence]
    paths:
      - ".github/workflows/fix-stochastic-import-order-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/p0-stochastic-equivalence

      - name: Apply exact Ruff import ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/envassure/differential/compare.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "from enum import StrEnum\n"
              "from math import exp, fsum, lgamma, log, log1p\n"
              "from collections.abc import Callable\n"
              "from statistics import NormalDist\n"
          )
          new = (
              "from collections.abc import Callable\n"
              "from enum import StrEnum\n"
              "from math import exp, fsum, lgamma, log, log1p\n"
              "from statistics import NormalDist\n"
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected compare.py standard-library import block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit exact import-order fix
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/differential/compare.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(differential): order standard-library imports"
          git push origin HEAD:assurance/p0-stochastic-equivalence
