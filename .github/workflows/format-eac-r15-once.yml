name: One-shot EAC-R15 formatting

on:
  push:
    branches: [assurance/eac-r15-protocol]
    paths:
      - ".github/workflows/format-eac-r15-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/eac-r15-protocol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical Ruff formatting
        run: |
          python -m pip install "ruff==0.16.4"
          ruff format src/envassure/benchmark/qualification.py
          ruff format --check src/envassure/benchmark/qualification.py
          git diff --check
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/benchmark/qualification.py
          git diff --cached --quiet && exit 1
          git commit -m "style(benchmark): apply canonical EAC-R15 formatting"
          git push origin HEAD:assurance/eac-r15-protocol
