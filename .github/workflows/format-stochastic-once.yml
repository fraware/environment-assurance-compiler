name: One-shot stochastic formatting

on:
  push:
    branches: [assurance/p0-stochastic-equivalence]
    paths:
      - ".github/workflows/format-stochastic-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/p0-stochastic-equivalence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical Ruff formatting
        run: |
          python -m pip install "ruff==0.16.4"
          ruff format src/envassure/differential/compare.py tests/test_stochastic_equivalence.py
          ruff format --check src/envassure/differential/compare.py tests/test_stochastic_equivalence.py
          git diff --check
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/differential/compare.py tests/test_stochastic_equivalence.py
          git diff --cached --quiet && exit 1
          git commit -m "style(differential): apply canonical stochastic formatting"
          git push origin HEAD:assurance/p0-stochastic-equivalence
