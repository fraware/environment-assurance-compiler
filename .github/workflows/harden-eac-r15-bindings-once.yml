name: Guarded EAC-R15 binding hardening

on:
  push:
    branches: [assurance/eac-r15-protocol]
    paths:
      - ".github/workflows/harden-eac-r15-bindings-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/eac-r15-protocol

      - name: Harden result-to-registration bindings
        run: |
          echo '' | base64 -d | python

      - name: Commit and remove maintenance workflow
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/harden-eac-r15-bindings-once.yml
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/benchmark/qualification.py tests/test_eac_r15_protocol.py
          git commit -m "fix(benchmark): bind EAC-R15 results to preregistration"
          git push origin HEAD:assurance/eac-r15-protocol
