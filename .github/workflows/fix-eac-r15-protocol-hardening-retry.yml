name: Retry guarded EAC-R15 protocol hardening

on:
  push:
    branches: [assurance/eac-r15-protocol]
    paths:
      - ".github/workflows/fix-eac-r15-protocol-hardening-retry.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/eac-r15-protocol

      - name: Apply guarded protocol hardening
        run: |
          echo '' | base64 -d | python

      - name: Commit hardening
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/benchmark/qualification.py tests/test_eac_r15_protocol.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(benchmark): harden EAC-R15 preregistration bindings"
          git push origin HEAD:assurance/eac-r15-protocol
