name: One-shot protocol formatting maintenance

on:
  push:
    branches: [assurance/eac-r15-protocol]
    paths:
      - ".github/workflows/fix-eac-r15-format-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/eac-r15-protocol
      - name: Apply asserted formatting transform
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/envassure/benchmark/qualification.py")
          text = path.read_text(encoding="utf-8")
          old = '            raise ValueError("qualification registration must prohibit reference access before freeze")\n'
          new = '''            raise ValueError(\n                "qualification registration must prohibit reference access before freeze"\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one formatting target")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit formatting change
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/benchmark/qualification.py
          git diff --cached --quiet && exit 1
          git commit -m "style(benchmark): apply protocol formatting"
          git push origin HEAD:assurance/eac-r15-protocol
