name: One-shot exact stochastic interval fix

on:
  push:
    branches: [assurance/p0-stochastic-equivalence]
    paths:
      - ".github/workflows/fix-stochastic-exact-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assurance/p0-stochastic-equivalence

      - name: Replace asymptotic paired interval with finite-sample bounds
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/envassure/differential/compare.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from math import sqrt\nfrom typing import Any\n",
              "from math import exp, fsum, lgamma, log, log1p\n"
              "from statistics import NormalDist\n"
              "from typing import Any, Callable\n",
              1,
          )
          text = text.replace(
              "    # Critical value for the paired mean-difference confidence interval.\n"
              "    # 1.96 corresponds approximately to a two-sided 95% interval.\n"
              "    stochastic_z: float = 1.96\n",
              "    # Backward-compatible confidence-level control. The value is converted\n"
              "    # to a two-sided nominal alpha for exact binomial bounds; it is not used\n"
              "    # as a Wald multiplier. 1.96 corresponds approximately to 95%.\n"
              "    stochastic_z: float = 1.96\n",
              1,
          )

          start = text.index("def _paired_rate_difference_ci(")
          end = text.index("\ndef _mapping_verdict(", start)
          replacement = r'''def _binomial_probability_sum(
              start: int,
              stop: int,
              n: int,
              p: float,
          ) -> float:
              """Return a numerically stable sum of Binomial(n, p) probabilities."""
              if start > stop:
                  return 0.0
              if p <= 0.0:
                  return 1.0 if start <= 0 <= stop else 0.0
              if p >= 1.0:
                  return 1.0 if start <= n <= stop else 0.0

              log_p = log(p)
              log_q = log1p(-p)
              log_n_factorial = lgamma(n + 1)
              log_terms = [
                  log_n_factorial
                  - lgamma(k + 1)
                  - lgamma(n - k + 1)
                  + k * log_p
                  + (n - k) * log_q
                  for k in range(start, stop + 1)
              ]
              max_log = max(log_terms)
              total = exp(max_log) * fsum(exp(value - max_log) for value in log_terms)
              return min(1.0, total)


          def _binomial_cdf(k: int, n: int, p: float) -> float:
              """Binomial CDF, summing the numerically smaller tail when possible."""
              if k < 0:
                  return 0.0
              if k >= n:
                  return 1.0
              if k < n * p:
                  return _binomial_probability_sum(0, k, n, p)
              upper = _binomial_probability_sum(k + 1, n, n, p)
              return max(0.0, 1.0 - upper)


          def _binomial_upper_tail(k: int, n: int, p: float) -> float:
              """P[X >= k] for X ~ Binomial(n, p), with stable tail selection."""
              if k <= 0:
                  return 1.0
              if k > n:
                  return 0.0
              if k > n * p:
                  return _binomial_probability_sum(k, n, n, p)
              lower = _binomial_probability_sum(0, k - 1, n, p)
              return max(0.0, 1.0 - lower)


          def _solve_probability(
              target: float,
              fn: Callable[[float], float],
              *,
              increasing: bool,
          ) -> float:
              """Invert a monotone probability function on [0, 1] by bisection."""
              lower = 0.0
              upper = 1.0
              for _ in range(70):
                  midpoint = (lower + upper) / 2.0
                  value = fn(midpoint)
                  if increasing:
                      if value < target:
                          lower = midpoint
                      else:
                          upper = midpoint
                  elif value > target:
                      lower = midpoint
                  else:
                      upper = midpoint
              return (lower + upper) / 2.0


          def _clopper_pearson_interval(
              successes: int,
              n: int,
              *,
              alpha: float,
          ) -> tuple[float, float]:
              """Equal-tailed Clopper-Pearson interval for a binomial proportion."""
              if n <= 0:
                  raise ValueError("n must be positive")
              if not 0 <= successes <= n:
                  raise ValueError("successes must be between 0 and n")
              if not 0.0 < alpha < 1.0:
                  raise ValueError("alpha must be in (0, 1)")

              tail = alpha / 2.0
              lower = (
                  0.0
                  if successes == 0
                  else _solve_probability(
                      tail,
                      lambda p: _binomial_upper_tail(successes, n, p),
                      increasing=True,
                  )
              )
              upper = (
                  1.0
                  if successes == n
                  else _solve_probability(
                      tail,
                      lambda p: _binomial_cdf(successes, n, p),
                      increasing=False,
                  )
              )
              return lower, upper


          def _paired_rate_difference_ci(
              samples: list[tuple[bool, bool]],
              *,
              z: float,
          ) -> tuple[float, float, float, float]:
              """Conservative finite-sample CI for candidate-minus-reference success.

              For paired binary outcomes, only discordant cells determine the marginal
              success-rate difference: ``delta = p01 - p10``. Each discordant-cell
              probability is a binomial marginal of the four-cell multinomial table.
              We compute Clopper-Pearson intervals for both probabilities and allocate
              half of the total error budget to each interval. Bonferroni therefore
              gives simultaneous coverage of at least ``1 - alpha``; subtracting the
              simultaneous bounds yields a conservative interval for ``delta``.

              ``z`` is retained for configuration compatibility and converted to the
              corresponding two-sided nominal alpha. It is not used as a Wald
              multiplier.

              Returns ``(difference, lower, upper, nominal_alpha)``.
              """
              n = len(samples)
              if n <= 0:
                  raise ValueError("paired samples must be non-empty")
              nominal_alpha = 2.0 * (1.0 - NormalDist().cdf(z))
              if not 0.0 < nominal_alpha < 1.0:
                  raise ValueError("stochastic_z does not define a finite confidence level")

              ref_only = sum(1 for reference, candidate in samples if reference and not candidate)
              cand_only = sum(1 for reference, candidate in samples if not reference and candidate)

              marginal_alpha = nominal_alpha / 2.0
              ref_lower, ref_upper = _clopper_pearson_interval(
                  ref_only,
                  n,
                  alpha=marginal_alpha,
              )
              cand_lower, cand_upper = _clopper_pearson_interval(
                  cand_only,
                  n,
                  alpha=marginal_alpha,
              )

              difference = (cand_only - ref_only) / n
              lower = max(-1.0, cand_lower - ref_upper)
              upper = min(1.0, cand_upper - ref_lower)
              return difference, lower, upper, nominal_alpha


          def _statistical_success(
              samples: list[tuple[bool, bool]],
              tol: ComparisonTolerances,
          ) -> DimensionVerdict:
              """Evaluate paired binary equivalence without non-rejection-as-proof.

              A match requires the entire conservative finite-sample confidence
              interval for the candidate-minus-reference success-rate difference to
              lie inside the preregistered equivalence margin. An interval wholly
              beyond a margin is a mismatch; overlap is indeterminate.
              """
              n = len(samples)
              if tol.equivalence_margin is None:
                  return DimensionVerdict(
                      dimension=ComparisonDimension.SUCCESS,
                      status=VerdictStatus.INDETERMINATE,
                      statistical=True,
                      confidence_note="equivalence_margin not declared for stochastic comparison",
                      detail="missing_equivalence_margin",
                  )
              if tol.equivalence_margin <= 0:
                  return DimensionVerdict(
                      dimension=ComparisonDimension.SUCCESS,
                      status=VerdictStatus.INDETERMINATE,
                      statistical=True,
                      confidence_note="equivalence_margin must be positive for stochastic comparison",
                      detail="invalid_equivalence_margin",
                  )
              if tol.stochastic_z <= 0:
                  return DimensionVerdict(
                      dimension=ComparisonDimension.SUCCESS,
                      status=VerdictStatus.INDETERMINATE,
                      statistical=True,
                      confidence_note="stochastic_z must be positive for stochastic comparison",
                      detail="invalid_confidence_critical_value",
                  )
              if n < tol.stochastic_min_samples:
                  note = (
                      f"only {n} samples; need >= {tol.stochastic_min_samples} for paired "
                      "binary success equivalence — indeterminate (not a match)"
                  )
                  return DimensionVerdict(
                      dimension=ComparisonDimension.SUCCESS,
                      status=VerdictStatus.INDETERMINATE,
                      statistical=True,
                      confidence_note=note,
                      detail="insufficient_samples",
                  )

              ref_rate = sum(1 for reference, _ in samples if reference) / n
              cand_rate = sum(1 for _, candidate in samples if candidate) / n
              try:
                  difference, lower, upper, nominal_alpha = _paired_rate_difference_ci(
                      samples,
                      z=tol.stochastic_z,
                  )
              except ValueError as exc:
                  return DimensionVerdict(
                      dimension=ComparisonDimension.SUCCESS,
                      status=VerdictStatus.INDETERMINATE,
                      statistical=True,
                      confidence_note=str(exc),
                      detail="invalid_confidence_critical_value",
                  )

              margin = tol.equivalence_margin
              discordant = sum(1 for reference, candidate in samples if reference != candidate)
              confidence = 1.0 - nominal_alpha
              note = (
                  f"n={n} ref_rate={ref_rate:.3f} cand_rate={cand_rate:.3f} "
                  f"delta(cand-ref)={difference:.4f} paired_ci=[{lower:.4f},{upper:.4f}] "
                  f"margin=[{-margin:.4f},{margin:.4f}] confidence={confidence:.5f} "
                  f"method=bonferroni-clopper-pearson discordant={discordant}"
              )

              if lower >= -margin and upper <= margin:
                  return DimensionVerdict(
                      dimension=ComparisonDimension.SUCCESS,
                      status=VerdictStatus.MATCH,
                      statistical=True,
                      confidence_note=note,
                      detail="paired confidence interval contained in declared equivalence region",
                  )

              if lower > margin or upper < -margin:
                  return DimensionVerdict(
                      dimension=ComparisonDimension.SUCCESS,
                      status=VerdictStatus.MISMATCH,
                      statistical=True,
                      confidence_note=note,
                      detail="paired confidence interval lies beyond declared equivalence margin",
                  )

              return DimensionVerdict(
                  dimension=ComparisonDimension.SUCCESS,
                  status=VerdictStatus.INDETERMINATE,
                  statistical=True,
                  confidence_note=note,
                  detail="paired confidence interval overlaps declared equivalence margin",
              )
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_stochastic_equivalence.py")
          test_path.write_text(
              '''"""Regression tests for stochastic equivalence verdict semantics."""\n\n'''
              '''from __future__ import annotations\n\n'''
              '''import pytest\n\n'''
              '''from envassure.differential.compare import (\n'''
              '''    ComparisonTolerances,\n'''
              '''    VerdictStatus,\n'''
              '''    _paired_rate_difference_ci,\n'''
              '''    _statistical_success,\n'''
              ''')\n\n\n'''
              '''def test_identical_paired_samples_establish_equivalence_with_nonzero_uncertainty() -> None:\n'''
              '''    samples = [(i % 2 == 0, i % 2 == 0) for i in range(100)]\n'''
              '''    difference, lower, upper, _alpha = _paired_rate_difference_ci(samples, z=1.96)\n'''
              '''    assert difference == 0.0\n'''
              '''    assert lower < 0.0 < upper\n'''
              '''    assert lower >= -0.05\n'''
              '''    assert upper <= 0.05\n\n'''
              '''    verdict = _statistical_success(\n'''
              '''        samples,\n'''
              '''        ComparisonTolerances(stochastic_min_samples=30, equivalence_margin=0.05),\n'''
              '''    )\n'''
              '''    assert verdict.status is VerdictStatus.MATCH\n'''
              '''    assert "method=bonferroni-clopper-pearson" in (verdict.confidence_note or "")\n\n\n'''
              '''def test_perfect_concordance_at_small_n_does_not_collapse_uncertainty() -> None:\n'''
              '''    samples = [(True, True)] * 30\n'''
              '''    difference, lower, upper, _alpha = _paired_rate_difference_ci(samples, z=1.96)\n'''
              '''    assert difference == 0.0\n'''
              '''    assert lower < -0.05\n'''
              '''    assert upper > 0.05\n\n'''
              '''    verdict = _statistical_success(\n'''
              '''        samples,\n'''
              '''        ComparisonTolerances(stochastic_min_samples=30, equivalence_margin=0.05),\n'''
              '''    )\n'''
              '''    assert verdict.status is VerdictStatus.INDETERMINATE\n\n\n'''
              '''def test_point_estimate_equality_does_not_prove_equivalence() -> None:\n'''
              '''    samples = (\n'''
              '''        [(True, False)] * 10\n'''
              '''        + [(False, True)] * 10\n'''
              '''        + [(True, True)] * 40\n'''
              '''        + [(False, False)] * 40\n'''
              '''    )\n'''
              '''    verdict = _statistical_success(\n'''
              '''        samples,\n'''
              '''        ComparisonTolerances(stochastic_min_samples=30, equivalence_margin=0.05),\n'''
              '''    )\n'''
              '''    assert verdict.status is VerdictStatus.INDETERMINATE\n'''
              '''    assert verdict.detail == "paired confidence interval overlaps declared equivalence margin"\n\n\n'''
              '''def test_small_well_estimated_difference_can_establish_equivalence() -> None:\n'''
              '''    samples = [(False, True)] * 2 + [(True, True)] * 99 + [(False, False)] * 99\n'''
              '''    difference, lower, upper, _alpha = _paired_rate_difference_ci(samples, z=1.96)\n'''
              '''    assert difference == pytest.approx(0.01)\n'''
              '''    assert lower >= -0.05\n'''
              '''    assert upper <= 0.05\n\n'''
              '''    verdict = _statistical_success(\n'''
              '''        samples,\n'''
              '''        ComparisonTolerances(stochastic_min_samples=30, equivalence_margin=0.05),\n'''
              '''    )\n'''
              '''    assert verdict.status is VerdictStatus.MATCH\n\n\n'''
              '''def test_clear_rate_divergence_is_mismatch() -> None:\n'''
              '''    samples = [(False, True)] * 100\n'''
              '''    verdict = _statistical_success(\n'''
              '''        samples,\n'''
              '''        ComparisonTolerances(stochastic_min_samples=30, equivalence_margin=0.05),\n'''
              '''    )\n'''
              '''    assert verdict.status is VerdictStatus.MISMATCH\n\n\n'''
              '''def test_underpowered_equivalence_is_indeterminate() -> None:\n'''
              '''    samples = [(True, True)] * 20\n'''
              '''    verdict = _statistical_success(\n'''
              '''        samples,\n'''
              '''        ComparisonTolerances(stochastic_min_samples=30, equivalence_margin=0.05),\n'''
              '''    )\n'''
              '''    assert verdict.status is VerdictStatus.INDETERMINATE\n'''
              '''    assert verdict.detail == "insufficient_samples"\n''',
              encoding="utf-8",
          )
          PY

      - name: Commit exact interval correction
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "repo-maintenance"
          git config user.email "repo-maintenance@users.noreply.github.com"
          git add src/envassure/differential/compare.py tests/test_stochastic_equivalence.py
          git diff --cached --quiet && exit 1
          git commit -m "fix(differential): use finite-sample paired equivalence bounds"
          git push origin HEAD:assurance/p0-stochastic-equivalence
